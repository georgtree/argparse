name: Tests
on: push
permissions:
  contents: read
jobs:
  tea:
    name: ${{ matrix.toolchain }} / Tcl 9.1.0 / C and Tcl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: linux-gcc
          - os: windows-2022
            toolchain: windows-ucrt64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tea
  msvc:
    name: windows-msvc / Tcl 9.1.0 / C and Tcl
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tcltk/tcl
          ref: core-9-1-0
          path: _ci/tcl
      - uses: actions/checkout@v4
        with:
          repository: tcltk/tcllib
          ref: tcllib-2-0
          path: _ci/tcllib
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build Tcl and argparse, then test both implementations
        shell: pwsh
        run: ./.github/scripts/build-msvc.ps1
