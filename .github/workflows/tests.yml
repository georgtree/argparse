name: Tests
on: push
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Tcl ${{ matrix.tcl }} / C and Tcl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        tcl: ['9.0.4', '9.1.0']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tea
        with:
          tcl: ${{ matrix.tcl }}
